<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light" />
    <script>
      try {
        var s = localStorage.getItem('color-scheme');
        var m = document.querySelector('meta[name="color-scheme"]');
        if (m) {
          if (s === 'dark') m.setAttribute('content', 'dark');
          else if (s === 'system') m.setAttribute('content', 'light dark');
          else m.setAttribute('content', 'light');
        }
      } catch (e) {}
    </script>
    <meta
      name="description"
      content="Cloak — privacy-first end-to-end encrypted real-time rooms, voice, video, screen sharing, and encrypted exports."
    />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <title>Cloak — Private Encrypted Rooms &amp; Voice</title>
  </head>
  <body class="bg-[var(--cloak-bg-void)] text-[var(--cloak-text)] antialiased selection:bg-[var(--cloak-accent-soft)] selection:text-[var(--cloak-text)]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
