[workspace]
resolver = "3"
members = [
    "services/core",
    "services/api",
    "services/worker",
    "crates/cloak-p2p",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"

[workspace.dependencies]
axum = { version = "0.8.9", features = ["ws", "macros"] }
tokio = { version = "1.54.1", features = ["full"] }
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "migrate", "uuid", "chrono", "json", "macros"] }
redis = { version = "1.8.1", features = ["tokio-comp", "connection-manager"] }
tower = "0.5.3"
tower-http = { version = "0.7.1", features = ["cors", "trace", "set-header", "limit"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
uuid = { version = "1.19.0", features = ["v4", "v7", "serde"] }
chrono = { version = "0.4.42", features = ["serde"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
ed25519-dalek = { version = "2.2.0", features = ["rand_core"] }
argon2 = "0.5.3"
sha2 = "0.10.9"
hmac = "0.12.1"
hex = "0.4.3"
base64 = "0.22.1"
rand = "0.8.5"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls", "stream"] }
thiserror = "2.0.17"
dotenvy = "0.15.7"
bytes = "1.11.0"
futures-util = "0.3.31"
subtle = "2.6.1"
urlencoding = "2.1.3"
rusqlite = { version = "0.35.0", features = ["bundled"] }
chacha20poly1305 = { version = "0.10.1", features = ["std"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hkdf = "0.12.4"
zeroize = { version = "1.8.1", features = ["derive"] }
include_dir = "0.7.4"
if-addrs = "0.13"
windows-sys = { version = "0.59.0", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_RemoteDesktop",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }

